##
## clamd.conf for Windows, hMailServer message store scanning
## Place in: C:\Program Files\ClamAV\clamd.conf
##
## Required directories, create them once:
##   C:\ProgramData\ClamAV\logs
##   C:\ProgramData\ClamAV\tmp
##
## The "Example" line of the sample file must stay removed, otherwise
## clamd refuses to start.
##
## Install and start the service:
##   clamd.exe --install
##   net start clamd
##

# --- Logging -----------------------------------------------------------------

LogFile "C:\ProgramData\ClamAV\logs\clamd.log"
LogFileMaxSize 20M
LogTime yes
LogRotate yes
LogClean no
LogVerbose no

# Log size and hash of every detection together with the verdict.
ExtendedDetectionInfo yes

# --- Paths -------------------------------------------------------------------

# Must match the DatabaseDirectory value in freshclam.conf.
DatabaseDirectory "C:\Program Files\ClamAV\database"
CVDCertsDirectory "C:\Program Files\ClamAV\certs"
TemporaryDirectory "C:\ProgramData\ClamAV\tmp"

# Uncomment to refuse to start with signatures older than a week. Leave it off
# on a mail server so a stale database never blocks the service.
#FailIfCvdOlderThan 7

# --- Socket ------------------------------------------------------------------
# The Windows daemon supports unsecured TCP sockets only, so bind to loopback.
# Use the literal address, not "localhost", because that name may resolve to
# ::1 while clamdscan connects over IPv4.

TCPSocket 3310
TCPAddr 127.0.0.1

MaxConnectionQueueLength 200
EnableShutdownCommand yes
EnableReloadCommand yes
EnableStatsCommand yes
EnableVersionCommand yes

# --- Concurrency and timeouts ------------------------------------------------

MaxThreads 12
MaxQueue 100
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 60

# Periodic database sanity check, seconds.
SelfCheck 600

# Reload signatures without blocking running scans. Costs extra RAM.
ConcurrentDatabaseReload yes

# Maximum size accepted over the socket in stream mode, used by clamdscan
# with the --stream option.
StreamMaxLength 100M

# --- Directory traversal -----------------------------------------------------

MaxDirectoryRecursion 20
FollowDirectorySymlinks no
FollowFileSymlinks no
CrossFilesystems yes

# ExcludePath values are regular expressions, so separators must be escaped.
# Never scan the quarantine directory: it holds deliberate copies of malware.
ExcludePath "^C:\\mail\\quarantine"

# Skip the resident antivirus program directory to avoid pointless work.
ExcludePath "^C:\\Program Files \(x86\)\\Kaspersky Lab"

# --- File type parsers -------------------------------------------------------
# ScanMail and ScanArchive are mandatory here: without them attachments inside
# .eml files are not unpacked and infected messages stay undetected.

ScanMail yes
ScanArchive yes
ScanPE yes
ScanELF no
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanOneNote yes
ScanHTML yes
ScanImage yes
ScanImageFuzzyHash yes

# RFC1341 messages split across several emails require periodic cleanup of
# the clamav-partial folder and can be abused for denial of service.
ScanPartialMessages no

PhishingSignatures yes
PhishingScanURLs yes

# --- Heuristics --------------------------------------------------------------
# Kept deliberately conservative: on a live mail store the macro and encrypted
# archive heuristics generate a large number of false positives.

HeuristicAlerts yes
HeuristicScanPrecedence no
AlertBrokenExecutables yes
AlertBrokenMedia no
AlertEncrypted no
AlertEncryptedArchive no
AlertEncryptedDoc no
AlertOLE2Macros no
AlertPhishingSSLMismatch no
AlertPhishingCloak no

# Report files that hit a limit as Heuristics.Limits.Exceeded instead of
# silently treating them as clean.
AlertExceedsMax yes

# Potentially unwanted applications are too noisy for mail archives.
DetectPUA no

# --- Limits ------------------------------------------------------------------
# Keep MaxFileSize aligned with the MaxFileSizeMB parameter of the cleanup
# script, and MaxScanSize at roughly four times that value.

MaxScanTime 300000
MaxScanSize 400M
MaxFileSize 100M
MaxRecursion 12
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxHTMLNoTags 8M
MaxScriptNormalize 20M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 100
MaxRecHWP3 16
PCREMatchLimit 100000
PCRERecMatchLimit 2000
PCREMaxFileSize 100M

# --- Caching -----------------------------------------------------------------

DisableCache no
CacheSize 65536

# --- Bytecode ----------------------------------------------------------------

Bytecode yes
BytecodeSecurity TrustSigned
BytecodeUnsigned no
BytecodeTimeout 10000

# --- Behaviour ---------------------------------------------------------------

OfficialDatabaseOnly no
ExitOnOOM yes
Foreground no
Debug no
LeaveTemporaryFiles no
AllowAllMatchScan yes

# VirusEvent runs for every detection. Deletion is handled by the cleanup
# script through the hMailServer COM API, so leave this disabled.
#VirusEvent "C:\mail\scripts\av\OnDetection.ps1"
