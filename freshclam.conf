##
## freshclam.conf for Windows, hMailServer message store scanning
## Place in: C:\Program Files\ClamAV\freshclam.conf
##
## Required directories, create them once:
##   C:\ProgramData\ClamAV\logs
##
## The "Example" line of the sample file must stay removed, otherwise
## freshclam refuses to start.
##

# --- Paths -------------------------------------------------------------------

# Must match the DatabaseDirectory value in clamd.conf.
DatabaseDirectory "C:\Program Files\ClamAV\database"

# CA certificates used to verify CVD signature archives.
CVDCertsDirectory "C:\Program Files\ClamAV\certs"

# --- Logging -----------------------------------------------------------------

UpdateLogFile "C:\ProgramData\ClamAV\logs\freshclam.log"
LogFileMaxSize 10M
LogTime yes
LogRotate yes
LogVerbose no

# --- Update source -----------------------------------------------------------

# One CDN name works world wide.
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net

# Attempts per mirror before giving up.
MaxAttempts 5

# Incremental (scripted) diffs instead of full CVD downloads.
ScriptedUpdates yes

# Keep local databases uncompressed for faster loading.
CompressLocalDatabase no

# Bytecode signatures add detection for newer threats.
Bytecode yes

# Load new databases into memory before replacing the old ones.
# Set to no only if the server is short on RAM.
TestDatabases yes

# --- Scheduling and timeouts -------------------------------------------------

# Checks per day when freshclam runs as a daemon. When freshclam is started
# on demand by the cleanup script, this value is not used.
Checks 12

ConnectTimeout 60
ReceiveTimeout 300

# --- Daemon integration ------------------------------------------------------

# Tell the running clamd to reload signatures right after a successful update,
# so no service restart is needed.
NotifyClamd "C:\Program Files\ClamAV\clamd.conf"

# --- Optional proxy ----------------------------------------------------------

# Uncomment and adjust if outbound HTTPS goes through a proxy.
#HTTPProxyServer http://proxy.example.local
#HTTPProxyPort 3128
#HTTPProxyUsername proxyuser
#HTTPProxyPassword proxypass

# --- Optional private mirror -------------------------------------------------

# Overrides DatabaseMirror, DNSDatabaseInfo and ScriptedUpdates.
#PrivateMirror mirror1.example.local
